name: docker

# 课堂系统镜像：推到 main / 打 tag 时构建并推 GHCR；PR 只构建 + 冒烟。
# 镜像名：ghcr.io/<owner>/<repo>（docker 要求全小写）
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时把 .tar 挂到 Release 需要写权限
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建并推送镜像
    # 打 tag 时不重建：同一个 commit 在主分支上已经构建过，交给下面的 retag 去移动标签。
    # 否则推 main + 推 tag 会对同一个 sha 各跑一次完整构建（约 60s 一次，纯浪费）。
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  retag:
    name: 打 tag 时只移动镜像标签（不重建）
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 首选：同一个 commit 在主分支构建时已打了 sha-<7位> 标签，
      #       这里把它再指一份到版本号上 —— 秒级完成，镜像逐字节相同。
      # 兜底：等不到（同时推 main+tag 时 tag 先到、或主分支那次失败/被取消），
      #       就**自己构建一次**。宁可多花 60 秒，也不能因为时序让发版卡住。
      - name: 打版本标签（能复制就复制，复制不到就构建）
        run: |
          set -euo pipefail
          # Docker 要求仓库名全小写，而 ${{ github.repository }} 可能是 TwiceTry/...
          # metadata-action 会自动转小写，手写脚本不会 —— 不转就成了
          # "repository name must be lowercase"，而且 imagetools inspect 也会因为这个查不到已有标签。
          REPO="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="sha-${GITHUB_SHA::7}"
          VER="${GITHUB_REF_NAME#v}"
          SRC="$REPO:$SHA_TAG"

          echo "源：$SRC"
          echo "目标：$REPO:$VER 与 $REPO:${GITHUB_REF_NAME}"

          # 等主分支的镜像上来（最多约 2 分钟，每 10 秒一次）
          ok=0
          for i in $(seq 1 12); do
            if docker buildx imagetools inspect "$SRC" >/dev/null 2>&1; then ok=1; break; fi
            echo "  第 $i 次查：$SHA_TAG 还没出现，10 秒后再看"
            sleep 10
          done

          if [ "$ok" = "1" ]; then
            echo "→ 复用主分支已构建的镜像"
            docker buildx imagetools create -t "$REPO:$VER" "$SRC"
            docker buildx imagetools create -t "$REPO:${GITHUB_REF_NAME}" "$SRC"
          else
            echo "→ 拿不到 $SHA_TAG，直接为这个 tag 构建一次（不推 sha- 标签）"
            docker buildx build \
              --file Dockerfile \
              --platform linux/amd64 \
              --push \
              --tag "$REPO:$VER" \
              --tag "$REPO:${GITHUB_REF_NAME}" \
              --cache-from type=gha \
              --cache-to type=gha,mode=max \
              .
          fi

      - name: 拉下来存成可离线导入的 .tar
        run: |
          set -euo pipefail
          # Docker 要求仓库名全小写，而 ${{ github.repository }} 可能是 TwiceTry/...
          # metadata-action 会自动转小写，手写脚本不会 —— 不转就成了
          # "repository name must be lowercase"，而且 imagetools inspect 也会因为这个查不到已有标签。
          REPO="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          VER="${GITHUB_REF_NAME#v}"
          docker pull "$REPO:$VER"
          docker save "$REPO:$VER" -o "teach-system-${VER}-image.tar"
          ls -lh "teach-system-${VER}-image.tar"

      - name: 挂到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: teach-system-*-image.tar
          generate_release_notes: true

      - name: 写摘要
        run: |
          {
            echo "## 镜像已打上版本标签（未重新构建）"
            echo ""
            echo '```'
            echo "docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}"
            echo "docker pull ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
            echo '```'
            echo ""
            echo "镜像内容与 \`sha-${GITHUB_SHA::7}\` 完全相同。"
          } >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: 跑一遍 + 导出可导入的镜像包
    # 打 tag 时不做完整构建与冒烟（镜像已在主分支验过），tar 由上面的 retag 产出
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 准备 buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建到本地（不推）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: teach-system:ci
          cache-from: type=gha

      - name: 起容器 + 冒烟
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/data"
          # 容器里以 node（uid 1000）运行，挂进去的目录要让它能写
          sudo chown -R 1000:1000 "$RUNNER_TEMP/data"
          docker run -d --name teach \
            -p 18730:18730 \
            -e TS_PASSWORD=ci-password \
            -v "$RUNNER_TEMP/data:/data" \
            teach-system:ci

          ok=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18730/api/health -o /tmp/health.json; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != "1" ]; then
            echo "::error::健康检查一直没通过"
            docker logs teach || true
            exit 1
          fi
          echo "--- /api/health"; cat /tmp/health.json; echo

          curl -fsS http://127.0.0.1:18730/ -o /tmp/index.html
          echo "--- 首页前 160 字节"; head -c 160 /tmp/index.html; echo

          curl -fsS -X POST http://127.0.0.1:18730/api/auth/login/teacher \
            -H 'Content-Type: application/json' \
            -d '{"password":"ci-password"}' -o /tmp/login.json
          echo "--- 登录"; head -c 120 /tmp/login.json; echo

          echo "--- 数据卷"; ls -1 "$RUNNER_TEMP/data"

      - name: 检查镜像里只有系统（不含课程内容 / 数据 / 分发文件）
        run: |
          set -euo pipefail
          echo "--- /app 顶层"
          docker run --rm --entrypoint sh teach-system:ci -c 'ls -la /app && du -sh /app/api /app/web/dist'

          bad=0
          for p in /app/data /app/downloads /app/content \
                   /app/api/lecture /app/api/materials "/app/api/代码示例" \
                   /app/api/data; do
            if docker run --rm --entrypoint sh teach-system:ci -c "test -e '$p'"; then
              echo "::error::镜像里不该有 $p（课程内容 / 数据 / 分发文件不进镜像）"
              bad=1
            fi
          done
          if [ "$bad" != "0" ]; then exit 1; fi
          echo "OK 镜像里只有系统本身（api + web/dist + 两套依赖）"

      - name: 导出成可直接导入的 .tar
        run: |
          set -euo pipefail
          REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
          IMAGE="ghcr.io/$REPO:$REF"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker tag teach-system:ci "$IMAGE"
          # 纯 tar：docker load -i 一步导入，不需要先解压
          docker save -o "$RUNNER_TEMP/teach-system-image.tar" "$IMAGE"
          ls -lh "$RUNNER_TEMP/teach-system-image.tar"

      - name: 验证这个 tar 能直接导入
        run: |
          set -euo pipefail
          docker rmi -f "$IMAGE" 2>/dev/null || true
          docker rmi -f teach-system:ci 2>/dev/null || true
          echo "--- docker load -i teach-system-image.tar"
          docker load -i "$RUNNER_TEMP/teach-system-image.tar"
          docker images | grep -i classroom-system || true
          echo "--- 导入后跑一条命令确认可用"
          docker run --rm --entrypoint sh "$IMAGE" -c 'node -v; ls -1 /app'

      - name: 上传镜像包为构建产物
        uses: actions/upload-artifact@v4
        with:
          name: teach-system-image
          path: ${{ runner.temp }}/teach-system-image.tar
          retention-days: 30
          compression-level: 6

      - name: 打 tag 时挂到 Release（那里下载就是 .tar，不经 zip）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" \
            --title "课堂系统 $TAG" \
            --notes "镜像包 teach-system-image.tar：下载后 docker load -i 直接导入。"
          gh release upload "$TAG" "$RUNNER_TEMP/teach-system-image.tar" --clobber
          echo "已挂到 Release：${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"

      - name: 写摘要（怎么拿到这个镜像）
        if: always()
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -z "${IMAGE:-}" ]; then
            REPO="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            REF="$(echo '${{ github.ref_name }}' | tr '/' '-')"
            IMAGE="ghcr.io/$REPO:$REF"
          fi
          SIZE="(没生成)"
          if [ -f "$RUNNER_TEMP/teach-system-image.tar" ]; then
            SIZE="$(du -h "$RUNNER_TEMP/teach-system-image.tar" | cut -f1)"
          fi
          {
            echo "## 课堂系统镜像"
            echo ""
            echo "- 镜像：\`$IMAGE\`"
            echo "- 镜像包：\`teach-system-image.tar\`（$SIZE，含 node:20-slim 基础层）"
            echo ""
            echo "### 方式一：下载 .tar 直接导入（不用配任何密钥）"
            echo ""
            echo "1. 打开 [$RUN_URL]($RUN_URL) → 页面底部 **Artifacts** → 下载 \`teach-system-image\`"
            echo "   （GitHub 会把 artifact 打成 zip，解开就是 \`teach-system-image.tar\`）"
            echo "2. 一条命令导入并运行："
            echo ""
            echo '```bash'
            echo "docker load -i teach-system-image.tar"
            echo "mkdir -p data && sudo chown -R 1000:1000 data   # Linux 才需要"
            echo "docker run -d --name teach -p 18730:18730 -e TS_PASSWORD=你的口令 -v \"\$PWD/data:/data\" $IMAGE"
            echo '```'
            echo ""
            echo "Docker Desktop 也可以：Images → 右上 Load → 选这个 .tar。"
            echo ""
            echo "### 方式二：docker pull（需要 GHCR 访问权限）"
            echo ""
            echo '```bash'
            echo "docker pull $IMAGE"
            echo '```'
            echo ""
            echo "> 镜像里只有系统本身（api + web/dist + 依赖 + 空白模板），"
            echo "> 不含任何课程内容、学生数据、Chrome 分发文件；那些在运行时用 -v ...:/data 挂进来。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 收尾
        if: always()
        run: |
          docker logs teach 2>&1 | tail -60 || true
          docker inspect --format '{{json .State.Health}}' teach 2>/dev/null || true
          docker rm -f teach || true
