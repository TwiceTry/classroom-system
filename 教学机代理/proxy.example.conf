# 教学机代理 · 配置
#
# 用法：把本文件复制一份，改名为「proxy.conf」（同目录），把里面的地址填好，
#       然后双击「启动代理.bat」。改完配置要重启代理才生效。
#
# 格式：key = value，# 开头是注释，等号两边空格可有可无。

# ---------------------------------------------------------------
# 1) 学生机访问的端口
# ---------------------------------------------------------------
# 教学机上监听哪个端口（学生机浏览器里就用这个端口）
listen.port = 18799

# 只监听某块网卡时填教学机的局域网 IP（例如 192.168.5.226）；留空 = 所有网卡都听
# 不填的话，两个网（局域网口与公网口）都能访问，一般不用改。
listen.host =

# ---------------------------------------------------------------
# 2) 公网上游地址（教学机从这里出去）
# ---------------------------------------------------------------
# 必填。写成 https://主机:端口 或 http://主机:端口
target = https://your-public-host:45600

# 上游证书自签 / 过期时，把 yes 打开（跳过证书校验）
tls.insecure = no

# ---------------------------------------------------------------
# 3) 投屏扇出
# ---------------------------------------------------------------
# 开着的时候：教师端 → 代理 → 服务器 → 代理 → N 个学生，
# 全程只有「公网上行 1 份 + 公网下行 1 份」；
# 关掉就是每个学生一条连接直连服务器（公网下行 N 份，人多就吃带宽）。
# 服务器那边一行都不用改 —— 它照旧给「学生连接」广播帧，
# 代理用一条上游连接接住，再在局域网里分给每个学生。
# 代理会自己数本地有几个人在看，并把「几人在看」改好后告诉教师端。
cast.fanout = yes

# ---------------------------------------------------------------
# 4) 缓存
# ---------------------------------------------------------------
# 说明：课堂系统只部署在公网那一份，教学机本机与局域网都不部署，
# 所以代理**不做任何分流**——页面、接口、静态资源、投屏的 /ws 全部转给 target。
# 为什么需要：公网隧道的下行带宽是瓶颈，而系统所有响应都是 no-cache，
# 浏览器每次都重下 —— 打开一次「代码练习」页就是 2.5MB（vue.global.js 580KB
# + sfc-loader 1.76MB + 前端资源 170KB）。30 个学生各开一次 = 75MB 全走公网。
# 代理在教学机上把公开资源缓存下来：第一个学生出公网，后面都本地命中；
# 同时把 Cache-Control 改成我们自己的，浏览器自己也会存下来。
#
# 关掉缓存：cache.enabled = no
cache.enabled = yes

# 缓存最多占多少内存（字节）。64MB 足够装下所有前端资源与示例运行时库
cache.maxbytes = 67108864

# 最多缓存多少条
cache.maxentries = 500

# 各类资源的缓存时长（秒）
#   assets：/assets/ 下的前端产物，文件名带内容哈希 → 一年
#   static：/vendor/、/examples/、图片 → 一天
#   content：讲义 / 材料正文 → 60 秒（老师改完课很快就能生效）
cache.ttl.assets = 31536000
cache.ttl.static = 86400
cache.ttl.content = 60

# ---------------------------------------------------------------
# 5) 其它
# ---------------------------------------------------------------
# 上游多久没回话算超时（毫秒）
timeout.ms = 120000

# 打印每条请求的状态码与耗时（排查用）
log.verbose = no

# 只在出错时打印
log.quiet = no
