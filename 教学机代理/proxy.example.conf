# 教学机代理 · 配置
#
# 用法：把本文件复制一份，改名为「proxy.conf」（同目录），把里面的地址填好，
#       然后双击「启动代理.bat」。改完配置要重启代理才生效。
#
# 格式：key = value，# 开头是注释，等号两边空格可有可无。

# ---------------------------------------------------------------
# 1) 学生机访问的端口
# ---------------------------------------------------------------
# 教学机上监听哪个端口（学生机浏览器里就用这个端口）
listen.port = 18799

# 只监听某块网卡时填教学机的局域网 IP（例如 192.168.5.226）；留空 = 所有网卡都听
# 不填的话，两个网（局域网口与公网口）都能访问，一般不用改。
listen.host =

# ---------------------------------------------------------------
# 2) 公网上游地址（教学机从这里出去）
# ---------------------------------------------------------------
# 必填。写成 https://主机:端口 或 http://主机:端口
target = https://your-public-host:45600

# 上游证书自签 / 过期时，把 yes 打开（跳过证书校验）
tls.insecure = no

# ---------------------------------------------------------------
# 3) 实时流量走本机（投屏 / 点名 / 在线状态不绕公网）
# ---------------------------------------------------------------
# 投屏的画面帧走公网绕一圈会很卡，所以这几类请求直接转到本机的课堂系统。
# 本机课堂系统没跑（或者你就是想全部走公网）时，把 enabled 改成 no。
local.enabled = yes

# 本机课堂系统的地址（默认端口 18730）
local.target = http://127.0.0.1:18730

# 哪些路径算「实时流量」（逗号分隔）
local.paths = /ws,/api/cast,/api/presence,/api/clock

# ---------------------------------------------------------------
# 4) 其它
# ---------------------------------------------------------------
# 上游多久没回话算超时（毫秒）
timeout.ms = 120000

# 打印每条请求的状态码与耗时（排查用）
log.verbose = no

# 只在出错时打印
log.quiet = no
