# 教学机代理 · 配置
#
# 用法：把本文件复制一份，改名为「proxy.conf」（同目录），把里面的地址填好，
#       然后双击「启动代理.bat」。改完配置要重启代理才生效。
#
# 格式：key = value，# 开头是注释，等号两边空格可有可无。

# ---------------------------------------------------------------
# 1) 学生机访问的端口
# ---------------------------------------------------------------
# 教学机上监听哪个端口（学生机浏览器里就用这个端口）
listen.port = 18799

# 只监听某块网卡时填教学机的局域网 IP（例如 192.168.5.226）；留空 = 所有网卡都听
# 不填的话，两个网（局域网口与公网口）都能访问，一般不用改。
listen.host =

# ---------------------------------------------------------------
# 2) 公网上游地址（教学机从这里出去）
# ---------------------------------------------------------------
# 必填。写成 https://主机:端口 或 http://主机:端口
target = https://your-public-host:45600

# ---------------------------------------------------------------
# 2.5) 从哪块网卡出去（教学机有两块网时）
# ---------------------------------------------------------------
# 填本机某块网卡的 IP，代理到上游的连接就从那块网卡出去。
# 留空 = 交给系统路由决定（**推荐**）。
#
# ⚠ 别轻易填。踩过的坑：填死 192.168.100.100（随身 WiFi）之后，
#   代理出网全部卡在 SYN 无响应，报 WinError 10060「连接超时」——
#   而系统默认路由明明是通的，看起来特别像「网络波动」，查了很久。
#   实测原因：随身 WiFi 被重连过，Windows 把网卡重建成了新接口（以太网 15 → 16），
#   代理进程绑的旧接口上下文随之失效 —— IP 甚至没变（还是 .100），连接照样出不去，
#   协议栈也不会自动退回默认路由。重连 WiFi 后必须重启代理才能恢复。
#   只有多网卡、必须强制从某块网卡出去时才填，并且填**当前**的 IP。
# 例：随身 WiFi（Remote NDIS）是 192.168.100.100，有线是 192.168.5.226
# bind.source = 192.168.100.100
#
# 注意：弱网（随身 WiFi / 手机热点）的并发连接数很有限，
# 几十条并发就可能把整条链路拖垮 —— 优先用有线的。

# ---------------------------------------------------------------
# 2.7) 边缘端：实时状态聚合成快照上云
# ---------------------------------------------------------------
# yes（默认）：学生的到场通道、投屏观看都**只在局域网里连着**，
#              代理本地记下「谁在场、谁在看投屏」，
#              每 edge.snapshot.interval 秒**打包成一个请求**上报云端。
#              好处：40 个学生 = 2 条长连接（而不是 80 条）+ 几 KB/周期
# no         ：实时通道逐条直连云端（行为与直连完全一样，但占连接）
edge.snapshot = yes

# 快照上报周期（秒）。越小越及时，越大越省流。
edge.snapshot.interval = 5

# 上报密钥（**必填**）：服务端只收签过名的上报。
# 这个请求代表的是「本地这一群人」，不认来源的话，
# 谁都能替全班报状态、甚至用一个空名单把整个班踢下线。
#
# 密钥从哪来：教师端调 GET /api/teacher/edge-key（带教师令牌），
# 或者直接看服务端 data/config.json 里的 edgeKey。
edge.key = 把服务端生成的密钥粘到这里

# 来源名（可选）：同一个服务端接多个教学机时用来区分，默认 lan-proxy
edge.source = lan-proxy

# ---------------------------------------------------------------
# 2.8) 上游连接池（keep-alive 复用）
# ---------------------------------------------------------------
# 每个请求都新建一条到上游的连接 = 每个请求一次 TLS 握手。
# 弱网上一次握手要 600ms，40 个学生同时开页就是 40 次握手 → 直接崩。
# 开了连接池：上游只保持这么多条连接，其余请求复用。
# upstream.pool = 8

# 上游证书自签 / 过期 / 证书链不全时，把 yes 打开（跳过证书校验）。
# Win7 上**建议就是 yes**：内嵌 Python 读「本地受信任根证书库」经常失败，
# 表现是「本地受信任证书库中缺少该域名的根证书或中间证书」。
# 设成 yes 时代理**根本不读证书库**，所以最稳。
tls.insecure = no

# 自建 CA / 想严格校验时，指定一份 CA bundle（可选）：
# tls.cafile = C:\certs\ca-bundle.crt

# ---------------------------------------------------------------
# 3) 投屏扇出
# ---------------------------------------------------------------
# 开着的时候：教师端 → 代理 → 服务器 → 代理 → N 个学生，
# 全程只有「公网上行 1 份 + 公网下行 1 份」；
# 关掉就是每个学生一条连接直连服务器（公网下行 N 份，人多就吃带宽）。
# 服务器那边一行都不用改 —— 它照旧给「学生连接」广播帧，
# 代理用一条上游连接接住，再在局域网里分给每个学生。
# 代理会自己数本地有几个人在看，并把「几人在看」改好后告诉教师端。
cast.fanout = yes

# ---------------------------------------------------------------
# 4) 缓存
# ---------------------------------------------------------------
# 缓存在**内存**里（LRU，默认上限 64MB），代理进程退出就没了；
# 重启后第一次访问会重新从公网拉一遍（教师机先打开一次页面就预热好了）。
# 说明：课堂系统只部署在公网那一份，教学机本机与局域网都不部署，
# 所以代理**不做任何分流**——页面、接口、静态资源、投屏的 /ws 全部转给 target。
# 为什么需要：公网隧道的下行带宽是瓶颈，而系统所有响应都是 no-cache，
# 浏览器每次都重下 —— 打开一次「代码练习」页就是 2.5MB（vue.global.js 580KB
# + sfc-loader 1.76MB + 前端资源 170KB）。30 个学生各开一次 = 75MB 全走公网。
# 代理在教学机上把公开资源缓存下来：第一个学生出公网，后面都本地命中；
# 同时把 Cache-Control 改成我们自己的，浏览器自己也会存下来。
#
# 关掉缓存：cache.enabled = no
cache.enabled = yes

# 缓存最多占多少内存（字节）。256MB 足够装下所有前端资源与示例运行时库，
# 还有大把余量；机器内存小就调小（64MB 也够用）。
cache.maxbytes = 268435456

# 最多缓存多少条
cache.maxentries = 2000

# 各类资源的缓存时长（秒）
#   assets：/assets/ 下的前端产物，文件名带内容哈希 → 一年
#   static：/vendor/、/examples/、图片 → 一天
#   content：讲义 / 材料正文 → 60 秒（老师改完课很快就能生效）
cache.ttl.assets = 31536000
cache.ttl.static = 86400
cache.ttl.content = 60
# SPA 的入口页（/、/student/materials 等所有前端路由）缓存多久
# 不缓存的话每个学生开页都要出公网拉一次 HTML → 40 个学生 = 40 条并发连接
# SPA 入口页（index.html）：代理自己缓存多久
cache.ttl.html = 300

# 入口页多久回上游核一次「有没有重新构建」。
# 服务端对入口页标的是 no-cache（前端一构建，旧的 hash 资源就没了，
# 拿到旧 HTML 就是白屏），所以代理不能长期不闻不问；
# 但也没必要每个学生都全量拉 —— 代理替**全班**去验一次，
# 没变的话上游回 304（几百字节），变了就整班一起换新的。
cache.ttl.html.verify = 30

# ---------------------------------------------------------------
# 5) 本地绿色版浏览器（可选，但建议放一份）
# ---------------------------------------------------------------
# 学生在「浏览器太旧」兜底页点「下载 Chrome」时，如果本地有这个包，
# 代理直接从局域网给出去 —— 85MB 不出公网，几十个学生同时点也不打满上行。
#
# **这个目录通常是被单独复制到机房的**（不跟整个系统一起走），
# 所以上一级的 downloads/ 往往不存在 —— 建议把那个 85MB 的包直接放在本目录。
#
# 不填也能用：先找本目录，再找上一级 downloads/：
#   chrome109.exe / chrome109.zip / chrome109.7z
#   或带版本号的便携版名（Chrome-109.0.5414.168-x64-1.15.2-Win7.exe）
# 填了就只认这一份（相对路径按本文件所在目录算）。
#
# 两种写法都行：
#   browser.file = Chrome-109.0.5414.168-x64-1.15.2-Win7.exe
#   browser.file = D:\课件\Chrome-109.0.5414.168-x64-1.15.2-Win7.exe
#
# 启动时会打印「浏览器包：本地有（85 MB · xxx.exe）」或「本地没有」。
# browser.file =

# ---------------------------------------------------------------
# 6) 其它
# ---------------------------------------------------------------
# 上游多久没回话算超时（毫秒）
timeout.ms = 120000

# 打印每条请求的状态码与耗时（排查用）
log.verbose = no

# 只在出错时打印
log.quiet = no
