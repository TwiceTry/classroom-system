# 教学机代理 —— 缓存预热名单
#
# 独立于 proxy.conf：调预热不用碰代理配置。
# 复制成 warmup.conf 使用（warmup.conf 已在 .gitignore，不进仓库）。
#
# 语法
#   每行一个 URI 模式；# 开头是注释。
#   *        通配任意字符（不含空格）
#   regex:   后面跟正则，例：regex:^/assets/.+\.js$
#   {courseId}  会替换成第一门未归档课程的 id
#   id=*     材料正文按课次 1..materials-max 逐个试
#
# 通配（带 * 的）只用来**过滤自动发现的候选**：
#   · /assets/* 的候选来自 HTML 和入口 bundle 里的 chunk 名
#   · /api/examples/* 的候选来自 /api/examples 返回的 lessons[].dir
# 发现不了的目录（比如 /vendor/ 下的动态 import）就写具体文件名。

# ---------------- 基础 ----------------
enabled = yes
# 并发数。几十个小文件串行拉要一分多钟。
workers = 16
# 教师口令：材料正文、代码示例、材料目录都要登录才给。
# 留空则读 ../data/config.json（同机部署免配置）；教学机上没有那个文件，在这里填。
password =

# ---------------- 静态资源 ----------------
# 自动发现：HTML 里引用的一切 + 入口 bundle 里的懒加载 chunk
[static]
/
/assets/*
# /lib 和 /vendor 下的文件名在 HTML 和入口 bundle 里都没有字符串（运行时拼的），
# 通配发现不到，这里写具体名 —— 它们本来就是固定的第三方库。
/lib/vue.global.js
/lib/vue3-sfc-loader.js
/lib/sfc-boot.js
/vendor/marked.min.js
/vendor/mermaid.min.js
/vendor/srcdoc.js
/favicon.svg

# ---------------- SPA 路由 ----------------
# 各路由返回同一份 HTML，但缓存 key 是完整 path，不预热的话每个都要 MISS 一次
[routes]
/login
/student/materials
/student/playground
/student/score
/student/watch
/teacher/classes
/teacher/attendance
/teacher/courses
/teacher/settings

# ---------------- 需要登录的公开内容 ----------------
# 只放「内容与身份无关」的接口。
# 绝不能放 /api/bootstrap、/api/classes/:id/scores 这类按人返回的 ——
# 缓存 key 不含 token，会把 A 的个人数据发给全班。
[content]
/api/courses/{courseId}/content/list?type=materials&path=materials
/api/examples?courseId={courseId}
/api/examples/*
/api/content/doc?type=materials&id=*&courseId={courseId}

# ---------------- 上限 ----------------
# 材料正文从 id=1 试到这个值（连续 3 次 404 就提前停）
materials-max = 30
# 预热前 N 节课的代码示例
examples-max = 25
